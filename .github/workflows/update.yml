name: watch vtium's releases

# The watcher. When vtium publishes a release newer than the tag the release
# recipes build, it moves the four release recipes to that release in one
# pull request (./bump-release), and queues the pull request to merge once
# build.yml's gate passes. build.yml then publishes the recipes to the AUR
# from main.
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  # vtium's release workflow can send this event to start the watcher at
  # once instead of at the next scheduled run.
  repository_dispatch:
    types: [vtium-release]

# Two runs at once would race to push the same branch.
concurrency:
  group: watch-vtium-releases
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # create-pull-request opens the pull request as the owner of the token it
  # is given. A pull request opened with the workflow's own GITHUB_TOKEN
  # starts no workflow, so build.yml would never build it, it would carry no
  # gate, and nothing would stand between the bump and the AUR. The watcher
  # therefore needs BUMP_PAT, and it stops here when BUMP_PAT is unset,
  # rather than open a pull request that nothing checks.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require the bump token
        env:
          BUMP_PAT: ${{ secrets.BUMP_PAT }}
        run: |
          test -n "$BUMP_PAT" || {
            echo "::error::BUMP_PAT is unset; a bump pull request opened without it would start no build and carry no gate."
            exit 1
          }

      # git asks this URL before every push, and GitHub answers 200 only to a
      # token that may push to the repository. A token that may only read it
      # gets 403, which is how the alpha.6 bump failed: a fine-grained token
      # whose resource owner was a user and not the vtium organization. The
      # check runs on every run, so a manual run of the watcher proves a new
      # token even when vtium has published no new release.
      - name: Check that the bump token may push
        env:
          BUMP_PAT: ${{ secrets.BUMP_PAT }}
        run: |
          code=$(printf 'user = "x-access-token:%s"\n' "$BUMP_PAT" |
            curl -s -o /dev/null -w '%{http_code}' --config - \
              "https://github.com/$GITHUB_REPOSITORY.git/info/refs?service=git-receive-pack")
          [ "$code" = 200 ] || {
            echo "::error::GitHub answered $code when BUMP_PAT asked to push to $GITHUB_REPOSITORY. BUMP_PAT needs a fine-grained token whose resource owner is ${GITHUB_REPOSITORY%%/*}, with Contents and Pull requests set to read and write on this repository, and the organization's approval when it requires one."
            exit 1
          }
          echo "BUMP_PAT may push to $GITHUB_REPOSITORY."

  bump:
    needs: preflight
    runs-on: ubuntu-latest
    # The identity of the watcher's commits, which tells them apart from a
    # commit a person pushes onto the bump pull request.
    env:
      WATCHER_NAME: vtium-arch watcher
      WATCHER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    container:
      image: archlinux:base-devel
    steps:
      - name: Install the tools
        run: pacman -Syu --noconfirm --needed git jq github-cli

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # makepkg --printsrcinfo, which bump-release runs, refuses to run as
      # root, which the container's user is.
      - name: Create the bump user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      # bump-release prints key=value lines, which become this step's
      # outputs, or nothing when the recipes already build the newest
      # release. Every step below is guarded on the output tag.
      - name: Find vtium's newest release
        id: up
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The shell, which runs as root, writes the outputs file, and
          # bump-release, which runs as builder, only prints.
          # shellcheck disable=SC2024
          sudo -u builder --preserve-env=GH_TOKEN ./bump-release >> "$GITHUB_OUTPUT"

      # create-pull-request runs git as root, so the workspace goes back to
      # root.
      - name: Give the workspace back to root
        if: steps.up.outputs.tag
        run: |
          chown -R root:root "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status --short

      # The watcher leaves the open bump pull request as it is when it already
      # proposes this tag, or when it carries a commit the watcher did not
      # write, such as a recipe change a person pushed onto it. Rewriting it
      # would rebuild the branch from main and drop that commit. A commit is
      # the watcher's when its author is the watcher's identity and its
      # subject is the watcher's commit message.
      - name: Look at the open bump pull request
        id: open
        if: steps.up.outputs.tag
        env:
          GH_TOKEN: ${{ secrets.BUMP_PAT }}
          TAG: ${{ steps.up.outputs.tag }}
        run: |
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head bump/vtium-release --state open --json number --jq '.[0].number // empty')
          [ -n "$pr" ] || exit 0
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          title=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json title --jq .title)
          foreign=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json commits --jq \
            '[.commits[] | select((.messageHeadline | startswith("bump: the release recipes build vtium ") | not)
                                  or ([.authors[].email] != [env.WATCHER_EMAIL])) | .oid[0:7]] | join(" ")')
          if [ "$title" = "vtium $TAG" ]; then
            echo "::notice::#$pr already proposes vtium $TAG, so the watcher leaves it as it is."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$foreign" ]; then
            echo "::notice::#$pr carries commits the watcher did not write ($foreign), so the watcher leaves it as it is and proposes vtium $TAG once #$pr merges or closes."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # One branch for every bump: when vtium publishes another release
      # before the last bump merged, the watcher rewrites the open pull
      # request to the newer release instead of opening a second one.
      - name: Open the pull request
        id: pr
        if: steps.up.outputs.tag && steps.open.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.BUMP_PAT }}
          branch: bump/vtium-release
          delete-branch: true
          author: ${{ env.WATCHER_NAME }} <${{ env.WATCHER_EMAIL }}>
          committer: ${{ env.WATCHER_NAME }} <${{ env.WATCHER_EMAIL }}>
          title: "vtium ${{ steps.up.outputs.tag }}"
          commit-message: "bump: the release recipes build vtium ${{ steps.up.outputs.tag }}, in place of ${{ steps.up.outputs.current }}"
          body: |
            vtium published the release [${{ steps.up.outputs.tag }}](${{ steps.up.outputs.url }})${{ steps.up.outputs.prerelease == 'true' && ', a pre-release,' || '' }} and the release recipes built ${{ steps.up.outputs.current }}. The watcher (`.github/workflows/update.yml`, which runs `./bump-release`) moves the recipes ${{ steps.up.outputs.recipes }} to the tag `${{ steps.up.outputs.tag }}`, as pkgver `${{ steps.up.outputs.pkgver }}` and pkgrel 1, makes each one's `.SRCINFO` again, and rewrites the tag in the README's table.

            build.yml builds every recipe from the new tag, checks the tag's signature against each recipe's `validpgpkeys`, and runs `aur-publish --dry-run` for each recipe. The watcher queues this pull request to merge once that build's gate passes, unless a recipe opts out with `ci/<recipe>/.no-auto-merge`. After the merge, build.yml on main publishes the recipes the AUR is behind on. A commit pushed onto this pull request stays: the watcher leaves a bump pull request alone once it carries a commit the watcher did not write.

      # The pull request this run opened, or the open one it left alone.
      #
      # A recipe opts out of the merge with ci/<recipe>/.no-auto-merge on the
      # pull request's branch. The watcher then turns off an auto-merge that
      # is already on, and the pull request waits for the maintainer.
      # Otherwise the watcher refuses to queue the merge unless main requires
      # the check gate, since GitHub would merge the pull request before its
      # build finished, and queues it through GraphQL's
      # enablePullRequestAutoMerge. Unlike gh pr merge --auto, that never
      # merges on the spot: on a pull request GitHub could merge at once, it
      # fails, and the watcher leaves the merge to the maintainer.
      - name: Queue the merge, or hold it
        if: steps.pr.outputs.pull-request-number || steps.open.outputs.number
        env:
          GH_TOKEN: ${{ secrets.BUMP_PAT }}
          PR: ${{ steps.pr.outputs.pull-request-number || steps.open.outputs.number }}
        run: |
          R=$GITHUB_REPOSITORY
          git fetch -q origin "refs/pull/$PR/head"
          held=$(git ls-tree -r --name-only FETCH_HEAD -- ci | grep '/\.no-auto-merge$' | tr '\n' ' ' || true)
          auto=$(gh pr view "$PR" -R "$R" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [ -n "$held" ]; then
            if [ "$auto" = true ]; then
              gh pr merge --disable-auto -R "$R" "$PR"
              echo "::notice::The watcher turned off the auto-merge of #$PR."
            fi
            echo "::notice::#$PR waits for the maintainer, because $held holds it."
            exit 0
          fi
          # Classic branch protection shows in the branch itself, which any
          # token that reads the repository can see, and in its protection
          # endpoint, which needs a token that may read the repository's
          # administration. Rulesets show in the rules endpoint.
          required=$( { gh api "repos/$R/branches/main" \
                          --jq '.protection.required_status_checks.contexts[]?' 2>/dev/null || true
                        gh api "repos/$R/branches/main/protection/required_status_checks" \
                          --jq '.contexts[]?, .checks[]?.context' 2>/dev/null || true
                        gh api "repos/$R/rules/branches/main" \
                          --jq '.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context' 2>/dev/null || true
                      } | sort -u)
          if ! grep -qx gate <<<"$required"; then
            echo "::error::#$PR waits for the maintainer: main's branch rule does not require the check gate, so a merge queued now would not wait for the build."
            exit 1
          fi
          if [ "$auto" = true ]; then
            echo "::notice::#$PR is already queued to merge once gate passes."
            exit 0
          fi
          id=$(gh pr view "$PR" -R "$R" --json id --jq .id)
          # $id in the query is GraphQL's variable, not the shell's.
          # shellcheck disable=SC2016
          if ! out=$(gh api graphql -f id="$id" -f query='
                mutation($id: ID!) {
                  enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: MERGE}) {
                    pullRequest { number }
                  }
                }' 2>&1); then
            if grep -qi 'clean status' <<<"$out"; then
              echo "::warning::#$PR passes every check already, and GitHub queues no auto-merge on a pull request it could merge at once, so #$PR waits for the maintainer to merge it."
              exit 0
            fi
            echo "::error::GitHub refused to queue the merge of #$PR: $out"
            exit 1
          fi
          echo "::notice::#$PR merges once gate passes."
